<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Movies</title>
    <style>
        body {
            margin: 0;
            padding: 32px;
            font-family: Arial, Helvetica, sans-serif;
            background: #1f2227;
            color: #f1f3f5;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 18px;
        }

        p a, form a, div a {
            color: #7cc4ff;
            text-decoration: none;
            margin-right: 10px;
            font-weight: 600;
        }

        p a:hover, form a:hover, div a:hover {
            text-decoration: underline;
        }

        form.filters {
            background: #2a2f36;
            border: 1px solid #3b4250;
            border-radius: 10px;
            padding: 14px;
            margin: 14px 0 18px 0;
        }

        label {
            margin-right: 8px;
            font-weight: 600;
        }

        input[type="text"] {
            background: #1f2227;
            color: #f1f3f5;
            border: 1px solid #4b5465;
            border-radius: 6px;
            padding: 7px 10px;
            margin-right: 12px;
        }

        button {
            border: none;
            border-radius: 6px;
            padding: 7px 12px;
            cursor: pointer;
            font-weight: 700;
            background: #2f81f7;
            color: #fff;
        }

        button:hover {
            background: #1f6fd9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #2a2f36;
            border: 1px solid #3b4250;
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 11px 12px;
            border-bottom: 1px solid #3b4250;
            text-align: left;
        }

        th {
            background: #333a45;
        }

        tr:hover {
            background: #2f3642;
        }

        td form {
            display: inline;
            padding: 0;
            margin: 0;
            border: none;
            background: transparent;
        }

        td form button {
            background: #dc3545;
            padding: 6px 10px;
        }

        td form button:hover {
            background: #c82333;
        }

        @media (prefers-color-scheme: light) {
            body {
                background: #f5f7fb;
                color: #20242b;
            }

            form.filters, table {
                background: #ffffff;
                border-color: #dbe2ea;
            }

            input[type="text"] {
                background: #ffffff;
                color: #20242b;
                border-color: #c7d1de;
            }

            th {
                background: #eef3f9;
            }

            tr:hover {
                background: #f4f7fc;
            }
        }
    </style>
</head>
<body>
<h2 th:text="#{app.title}">Movies</h2>

<p>
    <a th:href="@{/movies(lang='en',title=${title},genre=${genre},page=${currentPage},size=${size},sortBy=${sortBy},direction=${direction})}">EN</a>
    <a th:href="@{/movies(lang='ru',title=${title},genre=${genre},page=${currentPage},size=${size},sortBy=${sortBy},direction=${direction})}">RU</a>
    <a th:href="@{/movies(lang='az',title=${title},genre=${genre},page=${currentPage},size=${size},sortBy=${sortBy},direction=${direction})}">AZ</a>
</p>

<p>
    <a th:href="@{/movies/new}" th:text="'+ ' + #{button.create}">+ New movie</a>
    <form th:action="@{/logout}" method="post" style="display:inline;">
        <button type="submit" th:text="#{button.logout}">Logout</button>
    </form>
</p>

<form class="filters" method="get" th:action="@{/movies}">
    <a th:href="@{/movies(sortBy='title',direction=${sortBy == 'title' and direction == 'asc' ? 'desc' : 'asc'},title=${title},genre=${genre},page=${currentPage},size=${size})}">
        Sort by title
        <span th:if="${sortBy == 'title'}" th:text="${direction == 'asc' ? '↑' : '↓'}"></span>
    </a>
    <br><br>

    <label>Search by title:</label>
    <input type="text" name="title" th:value="${title}">

    <label>Search by genre:</label>
    <input type="text" name="genre" th:value="${genre}">

    <button type="submit" th:text="#{button.search}">Search</button>
    <a th:href="@{/movies}" th:text="#{button.reset}">Reset</a>
</form>

<br>
<table border="1">
    <tr>
        <th>Title</th>
        <th>Genre</th>
        <th>Rating</th>
        <th>Release Date</th>
        <th>Duration</th>
        <th>Director</th>
        <th th:if="${isAdmin}">Actions</th>
    </tr>

    <tr th:each="movie : ${movies}">
        <td th:text="${movie.title}"></td>
        <td th:text="${movie.genre}"></td>
        <td th:text="${movie.rating}"></td>
        <td th:text="${movie.releaseDate}"></td>
        <td th:text="${movie.duration}"></td>
        <td th:text="${movie.directorName}"></td>
        <td th:if="${isAdmin}">
            <a th:href="@{/movies/edit/{id}(id=${movie.id})}" th:text="#{button.edit}">Edit</a>
            <form th:action="@{/movies/delete/{id}(id=${movie.id})}" method="post" style="display:inline;" onsubmit="return handleDelete();">
                <button type="submit" th:text="#{button.delete}">Delete</button>
            </form>
        </td>
    </tr>
</table>

<br>
<div>
    <a th:if="${currentPage > 0}"
       th:href="@{/movies(page=${currentPage - 1},size=${size},title=${title},genre=${genre},sortBy=${sortBy},direction=${direction})}">&lt;- Prev</a>

    <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
        <a th:href="@{/movies(page=${i},size=${size},title=${title},genre=${genre},sortBy=${sortBy},direction=${direction})}"
           th:text="${i + 1}"
           th:style="${i == currentPage} ? 'font-weight:bold' : ''"></a>
    </span>

    <a th:if="${currentPage + 1 < totalPages}"
       th:href="@{/movies(page=${currentPage + 1},size=${size},title=${title},genre=${genre},sortBy=${sortBy},direction=${direction})}">Next -&gt;</a>
</div>

<script>
    function handleDelete() {
        return confirm("Delete this movie?");
    }
</script>
</body>
</html>
