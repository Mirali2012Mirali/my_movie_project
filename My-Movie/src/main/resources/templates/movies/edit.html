<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Movie</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1d2671, #c33764);
            font-family: Arial, sans-serif;
            color: #fff;
            padding: 20px;
        }
        .card {
            width: 430px;
            background: rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(14px);
            border-radius: 14px;
            padding: 24px;
        }
        .langs a, .actions a {
            color: #fff;
            margin-right: 10px;
            text-decoration: none;
            font-weight: 700;
        }
        .langs { margin-bottom: 12px; }
        h2 { margin-top: 0; }
        label { display: block; margin-top: 10px; font-weight: 600; }
        input, select, button {
            width: 100%;
            margin-top: 6px;
            border: none;
            border-radius: 8px;
            padding: 10px 12px;
            box-sizing: border-box;
        }
        button {
            margin-top: 16px;
            background: #0072ff;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }
        .error { color: #ffd6d6; font-size: 13px; margin-top: 4px; }
        .actions { margin-top: 14px; }
    </style>
</head>
<body>
<div class="card">
    <div class="langs">
        <a th:href="@{/movies/edit/{id}(id=${movieForm.id},lang='en')}">EN</a>
        <a th:href="@{/movies/edit/{id}(id=${movieForm.id},lang='ru')}">RU</a>
        <a th:href="@{/movies/edit/{id}(id=${movieForm.id},lang='az')}">AZ</a>
    </div>

    <h2 th:text="#{page.movie.edit}">Edit Movie</h2>
    <form th:action="@{/movies}" th:object="${movieForm}" method="post">
        <input type="hidden" th:field="*{id}">

        <label th:text="#{movie.title}">Title</label>
        <input type="text" th:field="*{title}">
        <div class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>

        <label th:text="#{movie.genre}">Genre</label>
        <input type="text" th:field="*{genre}">
        <div class="error" th:if="${#fields.hasErrors('genre')}" th:errors="*{genre}"></div>

        <label th:text="#{movie.rating}">Rating</label>
        <input type="number" step="0.1" th:field="*{rating}">
        <div class="error" th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}"></div>

        <label th:text="#{movie.duration}">Duration</label>
        <input type="text" th:field="*{duration}">
        <div class="error" th:if="${#fields.hasErrors('duration')}" th:errors="*{duration}"></div>

        <label th:text="#{movie.releaseDate}">Release Date</label>
        <input type="date" th:field="*{releaseDate}">
        <div class="error" th:if="${#fields.hasErrors('releaseDate')}" th:errors="*{releaseDate}"></div>

        <label th:text="#{field.director}">Director</label>
        <input type="text" th:field="*{directorName}" th:placeholder="#{field.chooseDirector}" list="directorOptions">
        <datalist id="directorOptions">
            <option th:each="name : ${directorNames}" th:value="${name}"></option>
        </datalist>
        <div class="error" th:if="${#fields.hasErrors('directorName')}" th:errors="*{directorName}"></div>

        <button type="submit" th:text="#{button.save}">Save</button>
    </form>

    <div class="actions">
        <a th:href="@{/movies}" th:text="#{link.back}">Back</a>
    </div>
</div>
</body>
</html>
